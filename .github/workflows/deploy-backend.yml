name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        run: |
          cd dashboard
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/image-dashboard:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/image-dashboard:latest

      - name: SSH into EC2 and Restart Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/image-dashboard:latest
            sudo docker rm -f dashboard-container || true
            sudo docker run -d --name dashboard-container -p 80:80 \
              -e AWS_DEFAULT_REGION=us-west-2 \
              -e TABLE_NAME=ImageMetadata \
              -e THUMBNAIL_BUCKET=shanjid-2026-image-thumbnails \
              ${{ secrets.DOCKERHUB_USERNAME }}/image-dashboard:latest
